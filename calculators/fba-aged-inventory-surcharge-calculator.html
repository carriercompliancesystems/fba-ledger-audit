<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon FBA Aged Inventory Surcharge & Cubic Feet Calculator</title>
  <meta name="description" content="Calculate monthly Amazon FBA aged inventory surcharges (181 to 365+ days) per cubic foot and spot phantom stranded inventory." />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; max-width: 760px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-top: 12px; }
    input, select, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #f8fafc; font-size: 15px; box-sizing: border-box; }
    button { background: #38bdf8; color: #0f172a; font-weight: 700; border: none; cursor: pointer; margin-top: 18px; }
    .out { margin-top: 18px; padding: 16px; background: #0f172a; border-radius: 8px; border-left: 4px solid #f59e0b; }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <p><a href="/">&larr; Back to Full FBA Inventory Ledger CSV Auditor</a></p>
  <div class="card">
    <h1>Amazon FBA Aged Inventory Surcharge Calculator</h1>
    <p>Estimate monthly aged inventory surcharges assessed on the 15th of each month for units stored in Amazon fulfillment centers over 180 days.</p>
    <label>Number of Aged Units</label>
    <input type="number" id="units" value="150" min="1" />
    <label>Cubic Feet per Unit (L &times; W &times; H in inches &divide; 1,728)</label>
    <input type="number" id="cuft" value="0.25" step="0.01" min="0.01" />
    <label>Inventory Age Tier</label>
    <select id="rate">
      <option value="0.50">181 – 210 Days ($0.50 / cu ft)</option>
      <option value="1.00">211 – 240 Days ($1.00 / cu ft)</option>
      <option value="1.50">241 – 270 Days ($1.50 / cu ft)</option>
      <option value="3.80">271 – 300 Days ($3.80 / cu ft)</option>
      <option value="4.00">301 – 330 Days ($4.00 / cu ft)</option>
      <option value="4.20">331 – 365 Days ($4.20 / cu ft)</option>
      <option value="6.90">365+ Days ($6.90 / cu ft or $0.15/unit min)</option>
    </select>
    <button onclick="calcAged()">Calculate Monthly Surcharge</button>
    <div id="out" class="out" style="display:none;"></div>
  </div>
  <script>
    function calcAged() {
      const u = parseFloat(document.getElementById("units").value) || 0;
      const cf = parseFloat(document.getElementById("cuft").value) || 0;
      const r = parseFloat(document.getElementById("rate").value) || 0;
      const totalCf = u * cf;
      const fee = totalCf * r;
      const box = document.getElementById("out");
      box.style.display = "block";
      box.innerHTML = `
        <strong>Estimated Monthly Aged Surcharge: $${fee.toFixed(2)}/month</strong><br>
        &bull; Total Storage Volume: <strong>${totalCf.toFixed(2)} cu ft</strong><br><br>
        <a href="/">Check if missing units in your FBA Inventory Ledger are reimbursable &rarr;</a>
      `;
    }
  </script>
</body>
</html>

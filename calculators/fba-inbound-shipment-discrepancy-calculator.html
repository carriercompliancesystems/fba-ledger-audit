<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon FBA Inbound Shipment Shortage & Reconciliation Calculator</title>
  <meta name="description" content="Calculate missing units and reimbursement value for an Amazon FBA inbound shipment discrepancy and check your 9-month reconciliation window." />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; max-width: 760px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-top: 12px; }
    input, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #f8fafc; font-size: 15px; box-sizing: border-box; }
    button { background: #38bdf8; color: #0f172a; font-weight: 700; border: none; cursor: pointer; margin-top: 18px; }
    .out { margin-top: 18px; padding: 16px; background: #0f172a; border-radius: 8px; border-left: 4px solid #22c55e; }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <p><a href="/">&larr; Back to Full FBA Inventory Ledger CSV Auditor</a></p>
  <div class="card">
    <h1>Amazon FBA Inbound Shipment Discrepancy Calculator</h1>
    <p>When Amazon receives fewer units at the fulfillment center than your carrier delivered, you have up to <strong>9 months</strong> from the shipment delivery date to open an inbound reconciliation claim.</p>
    <label>Units Shipped (Per Carrier Bill of Lading / Tracking)</label>
    <input type="number" id="shipped" value="240" min="1" />
    <label>Units Received &amp; Checked-In by Amazon</label>
    <input type="number" id="received" value="222" min="0" />
    <label>Unit Landed / Manufacturing Cost ($ USD)</label>
    <input type="number" id="cost" value="11.00" step="0.25" min="0.50" />
    <label>Shipment Delivery Date</label>
    <input type="date" id="delivDate" />
    <button onclick="calcInbound()">Calculate Inbound Shortage Claim</button>
    <div id="out" class="out" style="display:none;"></div>
  </div>
  <script>
    function calcInbound() {
      const s = parseFloat(document.getElementById("shipped").value) || 0;
      const r = parseFloat(document.getElementById("received").value) || 0;
      const c = parseFloat(document.getElementById("cost").value) || 0;
      const missing = Math.max(0, s - r);
      const val = missing * c;
      const rawDate = document.getElementById("delivDate").value;
      let deadlineMsg = "Enter delivery date above to check exact 9-month cutoff.";
      if (rawDate) {
        const d = new Date(rawDate + "T00:00:00");
        d.setMonth(d.getMonth() + 9);
        const daysLeft = Math.ceil((d.getTime() - Date.now()) / 86400000);
        deadlineMsg = daysLeft > 0
          ? `<strong>${daysLeft} days left</strong> to submit reconciliation (Cutoff: ${d.toDateString()}).`
          : `<strong>Window expired</strong> on ${d.toDateString()}.`;
      }
      const box = document.getElementById("out");
      box.style.display = "block";
      box.innerHTML = `
        <strong>Shortage Detected: ${missing} Missing Units ($${val.toFixed(2)} Est. Claim)</strong><br>
        &bull; ${deadlineMsg}<br><br>
        <a href="/">Audit your full FBA Inventory Ledger CSV for post-checkin warehouse losses &rarr;</a>
      `;
    }
  </script>
</body>
</html>
